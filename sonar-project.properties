# KeeperFX Sonar scanner config for a shared local SonarQube instance.
# Run with the VS Code task: Quality: Sonar Scan (global local server)

sonar.projectName=KeeperFX
sonar.sourceEncoding=UTF-8

# Project key/token are provided at scan time by task inputs.

sonar.sources=src,sdl,tests
sonar.exclusions=**/out/**,**/build/**,**/obj/**,**/deps/**,**/vcpkg_installed/**,**/*.md

# C/C++ analysis uses compile database generated by linux preset.
sonar.cfamily.compile-commands=out/build/linux-x64-release/compile_commands.json
sonar.cxx.file.suffixes=.c,.cc,.cpp,.cxx,.h,.hh,.hpp,.hxx

# Keep scan behavior report-oriented and avoid blocking on coverage until wired.
sonar.coverage.exclusions=**/*

# Clean as You Code — measure quality delta against master.
sonar.newCode.referenceBranch=master

# sonar-cxx: ingest tool reports when present (generated by quality tasks).
sonar.cxx.cppcheck.reportPaths=out/cppcheck.xml
sonar.cxx.clangtidy.reportPaths=out/clang-tidy.txt

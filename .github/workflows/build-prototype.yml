name: Test Prototypes

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, review_requested]
    branches: [ "**" ]

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      registry_owner: ${{ steps.lower.outputs.owner }}
    steps:
      - id: lower
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

  build-prototype:
    name: "Prototype ${{ matrix.name }}"
    runs-on: ubuntu-latest
    needs: prepare
    container:
      image: ghcr.io/${{ needs.prepare.outputs.registry_owner }}/keeperfx-build-${{ matrix.image }}:latest
      options: --user root

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86
            image: mingw32
            preset: windows-x86-release
            vcpkg-triplet: x86-mingw-cross

          - name: Windows x64
            image: mingw64
            preset: windows-x64-release
            vcpkg-triplet: x64-mingw-cross

          - name: Linux x64
            image: linux
            preset: linux-x64-release
            vcpkg-triplet: x64-linux-keeperfx

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Mark git directory as safe
        run: git config --global --add safe.directory '*'

      - name: Install vcpkg prerequisites
        run: apt-get update -qq && apt-get install -y --no-install-recommends zip unzip python3 nasm autoconf autoconf-archive automake libtool gcc-multilib libc6-dev-i386 pkg-config

      - name: Enable vcpkg binary caching (x-gha)
        run: |
          echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> $GITHUB_ENV
          echo "ACTIONS_CACHE_URL=${ACTIONS_CACHE_URL}" >> $GITHUB_ENV
          echo "ACTIONS_RUNTIME_TOKEN=${ACTIONS_RUNTIME_TOKEN}" >> $GITHUB_ENV

      - name: Cache vcpkg bootstrap binary
        id: cache-vcpkg-bootstrap
        uses: actions/cache@v4
        with:
          path: external/vcpkg/vcpkg
          key: vcpkg-bootstrap-linux-${{ hashFiles('external/vcpkg/CMakeLists.txt') }}

      - name: Bootstrap vcpkg
        if: steps.cache-vcpkg-bootstrap.outputs.cache-hit != 'true'
        run: |
          chmod +x ./external/vcpkg/bootstrap-vcpkg.sh
          ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: external/vcpkg/downloads
          key: vcpkg-downloads-${{ matrix.vcpkg-triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-${{ matrix.vcpkg-triplet }}-
            vcpkg-downloads-

      - name: Install vcpkg packages
        run: |
          ./external/vcpkg/vcpkg install \
            --triplet ${{ matrix.vcpkg-triplet }} \
            --overlay-triplets build/vcpkg-triplets \
            --x-install-root=vcpkg_installed \
            --allow-unsupported

      - name: Set prototype suffix
        run: |
          GITHUB_SHA=$(cat "$GITHUB_EVENT_PATH" | python3 -c "import sys,json; print(json.load(sys.stdin)['pull_request']['head']['sha'])")
          echo "PACKAGE_SUFFIX=Prototype_$(git rev-parse --short=7 $GITHUB_SHA)" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(git rev-list --count origin/master)" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }} -DPACKAGE_SUFFIX=${{ env.PACKAGE_SUFFIX }} -DBUILD_NUMBER=${{ env.BUILD_NUMBER }}
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4

      - name: Upload prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: keeperfx-prototype-${{ matrix.preset }}-${{ env.PACKAGE_SUFFIX }}
          path: |
            out/build/${{ matrix.preset }}/keeperfx*
            out/build/${{ matrix.preset }}/*.exe
            out/build/${{ matrix.preset }}/*.dll
            out/build/${{ matrix.preset }}/*.map
          if-no-files-found: warn


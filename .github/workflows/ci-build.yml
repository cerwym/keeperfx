name: CI Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:


jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      registry_owner: ${{ steps.lower.outputs.owner }}
    steps:
      - id: lower
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: prepare
    container:
      image: ghcr.io/${{ needs.prepare.outputs.registry_owner }}/keeperfx-build-${{ matrix.image }}:latest
      options: --user root

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86
            image: mingw32
            preset: windows-x86-release
            vcpkg-triplet: x86-mingw-cross
            artifact-name: keeperfx-windows-x86

          - name: Linux x64
            image: linux
            preset: linux-x64-release
            vcpkg-triplet: x64-linux-keeperfx
            artifact-name: keeperfx-linux-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Mark git directory as safe
        run: git config --global --add safe.directory '*'

      # vcpkg bootstrap compiles from source and needs zip + python3.
      # These are baked into rebuilt Docker images but we install here as a
      # safety net while old images are still in the registry.
      # autoconf/automake/libtool: needed by alsa vcpkg port (autotools-based)
      # gcc-multilib/libc6-dev-i386: needed for luajit buildvm-32 on x64 host
      # pkg-config: needed by vcpkg_fixup_pkgconfig for mingw cross-builds
      - name: Install vcpkg prerequisites
        run: apt-get update -qq && apt-get install -y --no-install-recommends zip unzip python3 nasm autoconf automake libtool gcc-multilib libc6-dev-i386 pkg-config

      - name: Export vcpkg binary-cache env vars
        run: |
          echo "ACTIONS_CACHE_URL=${ACTIONS_CACHE_URL}" >> $GITHUB_ENV
          echo "ACTIONS_RUNTIME_TOKEN=${ACTIONS_RUNTIME_TOKEN}" >> $GITHUB_ENV

      - name: Bootstrap vcpkg
        run: |
          chmod +x ./external/vcpkg/bootstrap-vcpkg.sh
          ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Install vcpkg packages
        run: |
          ./external/vcpkg/vcpkg install \
            --triplet ${{ matrix.vcpkg-triplet }} \
            --overlay-triplets build/vcpkg-triplets \
            --x-install-root=vcpkg_installed \
            --allow-unsupported
        env:
          VCPKG_BINARY_SOURCES: "clear"

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4

      - name: Run tests (ASAN)
        if: contains(matrix.preset, 'asan')
        run: ./out/build/${{ matrix.preset }}/tests
        env:
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1:print_stats=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            out/build/${{ matrix.preset }}/keeperfx*
            out/build/${{ matrix.preset }}/*.exe
            out/build/${{ matrix.preset }}/*.map
            out/build/${{ matrix.preset }}/*.dll
          if-no-files-found: warn

  build-msvc:
    name: Build Windows x64 (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Export vcpkg binary-cache env vars
        shell: bash
        run: |
          echo "ACTIONS_CACHE_URL=${ACTIONS_CACHE_URL}" >> $GITHUB_ENV
          echo "ACTIONS_RUNTIME_TOKEN=${ACTIONS_RUNTIME_TOKEN}" >> $GITHUB_ENV

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          cd external/vcpkg
          .\bootstrap-vcpkg.bat -disableMetrics

      - name: Setup MSVC Developer Environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          $output = cmd /c "`"$vcvars`" > nul 2>&1 && set"
          foreach ($line in $output) {
            if ($line -match '^([^=]+)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
            }
          }

      - name: Configure CMake
        shell: pwsh
        run: cmake --preset x64-windows-static-debug

      - name: Build
        shell: pwsh
        run: cmake --build --preset x64-windows-static-debug

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keeperfx-windows-x64-msvc-debug
          path: |
            out/build/x64-windows-static-debug/keeperfx*.exe
            out/build/x64-windows-static-debug/*.pdb
            out/build/x64-windows-static-debug/*.map
          if-no-files-found: warn

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build, build-msvc]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" == "success" ] && [ "${{ needs.build-msvc.result }}" == "success" ]; then
            echo "✅ All builds passed!"
            exit 0
          else
            echo "❌ One or more builds failed"
            exit 1
          fi


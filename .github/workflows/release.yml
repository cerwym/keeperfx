name: Release

on:
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.2.0)'
        required: true
        type: string

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      registry_owner: ${{ steps.lower.outputs.owner }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: lower
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

  # ── Linux + Windows MinGW — built in Docker containers on Ubuntu ─────────────
  build-containerized:
    name: Build ${{ matrix.name }}
    # Fork release ships x64 (MSVC) + Vita only; MinGW x86/x64 + Linux run upstream.
    if: ${{ github.repository == 'dkfans/keeperfx' }}
    runs-on: ubuntu-latest
    needs: prepare
    container:
      image: ghcr.io/${{ needs.prepare.outputs.registry_owner }}/keeperfx-build-${{ matrix.image }}:latest
      options: --user root

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86 (MinGW)
            image: mingw32
            preset: windows-x86-release
            artifact-name: keeperfx-windows-x86-mingw
            platform: windows-x86-mingw
            pkg: zip

          - name: Windows x64 (MinGW)
            image: mingw64
            preset: windows-x64-release
            artifact-name: keeperfx-windows-x64-mingw
            platform: windows-x64-mingw
            pkg: zip

          - name: Linux x64
            image: linux
            preset: linux-x64-release
            artifact-name: keeperfx-linux-x64
            platform: linux-x64
            pkg: tar

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Mark git directory as safe
        run: git config --global --add safe.directory '*'

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4

      - name: Package artifacts (zip)
        if: matrix.pkg == 'zip'
        run: |
          apt-get install -y -qq zip
          cd out/build/${{ matrix.preset }}
          zip -r ../../../keeperfx-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.zip keeperfx* *.exe *.map *.dll || true

      - name: Package artifacts (tar)
        if: matrix.pkg == 'tar'
        run: |
          cd out/build/${{ matrix.preset }}
          tar czf ../../../keeperfx-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.tar.gz keeperfx* *.map || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: keeperfx-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.*

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: keeperfx-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Windows MSVC x64 — native Windows runner ────────────────────────────────
  build-msvc:
    name: Build Windows x64 (MSVC)
    runs-on: windows-latest
    needs: prepare

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          cd external/vcpkg
          .\bootstrap-vcpkg.bat -disableMetrics

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../vcpkg_installed_x64
          key: vcpkg-msvc-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Setup MSVC Developer Environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          $output = cmd /c "`"$vcvars`" > nul 2>&1 && set"
          foreach ($line in $output) {
            if ($line -match '^([^=]+)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
            }
          }

      - name: Configure CMake
        shell: pwsh
        run: cmake --preset x64-windows-static-release
        env:
          VCPKG_BINARY_SOURCES: "clear"

      - name: Build
        shell: pwsh
        run: cmake --build --preset x64-windows-static-release

      - name: Package artifacts
        run: |
          cd out/build/x64-windows-static-release
          7z a ../../../keeperfx-${{ needs.prepare.outputs.version }}-windows-x64-msvc.zip keeperfx* *.exe *.map

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keeperfx-windows-x64-msvc
          path: keeperfx-${{ needs.prepare.outputs.version }}-windows-x64-msvc.zip

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: keeperfx-${{ needs.prepare.outputs.version }}-windows-x64-msvc.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS Universal — native macOS runner ────────────────────────────────────
  build-macos:
    name: Build macOS Universal
    # Fork release ships x64 + Vita only; macOS builds upstream.
    if: ${{ github.repository == 'dkfans/keeperfx' }}
    runs-on: macos-14
    needs: prepare

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Bootstrap vcpkg
        run: |
          chmod +x ./external/vcpkg/bootstrap-vcpkg.sh
          ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../vcpkg_installed_macos
          key: vcpkg-macos-universal-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Configure CMake
        run: cmake --preset macos-universal
        env:
          VCPKG_BINARY_SOURCES: "clear"

      - name: Build
        run: cmake --build --preset macos-universal

      - name: Package artifacts
        run: |
          cd out/build/macos-universal
          zip -r ../../../keeperfx-${{ needs.prepare.outputs.version }}-macos-universal.zip keeperfx* *.map || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keeperfx-macos-universal
          path: keeperfx-${{ needs.prepare.outputs.version }}-macos-universal.zip

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: keeperfx-${{ needs.prepare.outputs.version }}-macos-universal.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── WebAssembly — native Ubuntu, Emscripten toolchain ────────────────────────
  build-wasm:
    name: Build WebAssembly
    # Fork release ships x64 + Vita only; wasm builds upstream.
    if: ${{ github.repository == 'dkfans/keeperfx' }}
    runs-on: ubuntu-24.04
    needs: prepare

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Configure CMake
        run: cmake --preset wasm-release

      - name: Build
        run: cmake --build --preset wasm-release

      - name: Package artifacts
        run: |
          cd out/build/wasm-release
          tar czf ../../../keeperfx-${{ needs.prepare.outputs.version }}-wasm.tar.gz *.wasm *.js *.html

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keeperfx-wasm
          path: keeperfx-${{ needs.prepare.outputs.version }}-wasm.tar.gz

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: keeperfx-${{ needs.prepare.outputs.version }}-wasm.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Homebrew platforms (3DS, Vita, Switch, Wii U) — SDK containers ───────────
  build-homebrew:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: prepare
    container:
      image: ghcr.io/${{ needs.prepare.outputs.registry_owner }}/${{ matrix.image }}:latest
      options: --user root

    strategy:
      fail-fast: false
      matrix:
        include:
          # 3DS / Switch / Wii U are disabled (early-stage; kept for future dev via
          # their standalone workflow_dispatch build workflows). Vita ships on both
          # fork and upstream.
          - name: PS Vita
            preset: vita-release
            image: build-vitasdk
            artifact-name: keeperfx-vita
            platform: vita

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Mark git directory as safe
        run: git config --global --add safe.directory '*'

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Package artifacts
        run: |
          cd out/build/${{ matrix.preset }}
          tar czf ../../../keeperfx-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.tar.gz *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: keeperfx-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.tar.gz

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: keeperfx-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release Patches (Unsigned)

on:
  workflow_call:
    outputs:
      artifact-id:
        description: "The ID of the uploaded artifact"
        value: ${{ jobs.build-release-patch-unsigned.outputs.artifact-id }}
      zip-name:
        description: "The name of the ZIP file without extension"
        value: ${{ jobs.build-release-patch-unsigned.outputs.zip-name }}
  workflow_dispatch:

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      registry_owner: ${{ steps.lower.outputs.owner }}
    steps:
      - id: lower
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

  build-release-patch-unsigned:

    name: "Build Release Patch (Unsigned)"
    runs-on: ubuntu-24.04
    needs: prepare
    container:
      image: ghcr.io/${{ needs.prepare.outputs.registry_owner }}/keeperfx-build-mingw32:latest
      options: --user root

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Mark git directory as safe
      run: git config --global --add safe.directory '*'

    - name: Install packaging tools
      run: |
        set -eux
        apt-get update -qq
        apt-get install -y --no-install-recommends 7zip make

    - uses: dkfans/setup-cpp@master

    - name: Set build variables
      run: |
        echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
        echo "PACKAGE_SUFFIX=" >> "$GITHUB_ENV"

    - name: Build (CMake)
      run: |
        set -eux
        cmake --preset windows-x86-release
        cmake --build --preset windows-x86-release
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: 4

    - name: Get gfx submodule SHA for cache key
      id: gfx-sha
      run: echo "sha=$(git ls-tree HEAD gfx | awk '{print $3}')" >> $GITHUB_OUTPUT

    - name: Restore pkg-enginegfx cache
      id: pkg-cache
      uses: actions/cache@v4
      with:
        path: pkg/
        key: pkg-enginegfx-${{ hashFiles('build/make/pkg_gfx.mk') }}-${{ steps.gfx-sha.outputs.sha }}

    - name: Package graphics data
      if: steps.pkg-cache.outputs.cache-hit != 'true'
      run: |
        set -eux
        make BUILD_NUMBER=$BUILD_NUMBER PACKAGE_SUFFIX=$PACKAGE_SUFFIX pkg-enginegfx

    - name: Copy SDL2 DLLs for packaging
      run: |
        set -eux
        mkdir -p sdl/for_final_package
        cp /usr/i686-w64-mingw32/bin/SDL2.dll       sdl/for_final_package/
        cp /usr/i686-w64-mingw32/bin/SDL2_mixer.dll  sdl/for_final_package/
        cp /usr/i686-w64-mingw32/bin/SDL2_image.dll  sdl/for_final_package/
        cp /usr/i686-w64-mingw32/bin/SDL2_net.dll    sdl/for_final_package/

    - name: Create release package
      run: |
        set -eux
        make BUILD_NUMBER=$BUILD_NUMBER PACKAGE_SUFFIX=$PACKAGE_SUFFIX package
        echo "ZIP_NAME=$(basename -s .7z pkg/keeperfx*.7z)" >> "$GITHUB_ENV"
        rm pkg/keeperfx*.7z

    - name: Upload artifact
      id: upload-artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ZIP_NAME }}
        path: pkg/**
      
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
      zip-name: ${{ env.ZIP_NAME }}